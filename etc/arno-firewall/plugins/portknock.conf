# ------------------------------------------------------------------------------
#         -= Arno's (NFT) Firewall(ANF) - Port Knocking plugin =-
# ------------------------------------------------------------------------------
#
# This plugin opens configured TCP/UDP ports on this firewall host for a short
# time after a configured sequence of knocks (TCP SYN or UDP packets) is seen
# on an external interface.
#
# The sequence is a shared secret: keep this file root-only (0600). The
# installer enforces this. Do not reuse ports that are in use by services.
#
# Example: knock tcp/38281 tcp/29374 udp/4921 tcp/54918, then tcp/22 is
# opened for PORTKNOCK_OPEN_TIME seconds.
#
# To actually enable this plugin make ENABLED=1:
# ------------------------------------------------------------------------------
ENABLED=0

# Interfaces on which knocks are accepted. Empty = use EXT_IF from
# firewall.conf. Wildcards with a trailing '+' are supported (eg. "ppp+").
# ------------------------------------------------------------------------------
PORTKNOCK_INTERFACE=""

# Knock sequence: PROTO/PORT items, separated by spaces/commas.
# PROTO is "tcp" or "udp"; a bare "PORT" means tcp.
# Use long, random, unused ports. At least 3 steps are recommended.
# NOTE: Do not use ports that also appear in PORTKNOCK_OPEN.
# ------------------------------------------------------------------------------
PORTKNOCK_SEQUENCE="tcp/38281 tcp/29374 udp/4921 tcp/54918"

# Ports to open after a valid knock: PROTO/PORT items, separated by
# spaces/commas. A bare "PORT" means tcp.
# ------------------------------------------------------------------------------
PORTKNOCK_OPEN="tcp/22"

# Seconds the target port(s) stay open after a valid knock. Default: 90.
# ------------------------------------------------------------------------------
PORTKNOCK_OPEN_TIME=90

# Seconds allowed between two knocks of the sequence.
# ------------------------------------------------------------------------------
PORTKNOCK_SEQ_TIMEOUT=10

# 0 = source-only:
#     - only the initiating source of the knocked IP family may use the opened
#       target ports;
#     - the other IP family is not opened;
#     - a dual-stack client must knock over both families.
# 1 = ALL remote IPs arriving on the same external interface may use the
#     opened target ports during the open window. This is risky: the sequence
#     becomes a shared "open everything" secret and a spoofed sequence opens
#     it to all sources on that interface.
#     Note: this opens the knocked interface, not every interface.
#     With IPV6_SUPPORT=1, a knock on either IP family opens the configured
#     target ports for both families (all sources on that interface).
#     With IPV6_SUPPORT=0, only IPv4 is opened.
# ------------------------------------------------------------------------------
PORTKNOCK_ALLOW_ALL=0

# Log successful knocks (1) or not (0).
# ------------------------------------------------------------------------------
PORTKNOCK_LOG=1

# Check configured sequence/target ports against rules already handled by
# firewall.conf or hardcoded ANF rules on PORTKNOCK_INTERFACE:
#   - PORTKNOCK_ALLOW_ALL=0: a conflict disables that IP family's portknock
#     side for the affected interface; the other family keeps working
#   - PORTKNOCK_ALLOW_ALL=1: a target-port conflict disables the whole plugin;
#     a sequence-port conflict skips the interface (both families)
#   - other enabled plugins/custom rules (accept/drop/reject/jump) and
#     unresolved rules are warnings only; the current nft batch and the main
#     input chains are inspected. Other tables and user plugins loaded after
#     99portknock are not inspected.
# IPv4 and IPv6 destination addresses/networks in firewall.conf are matched
# against the interface. IPv6-only rules are ignored when IPV6_SUPPORT=0.
# Invalid plugin settings are also reported and disable the plugin; the
# firewall itself still starts.
# 1 = enabled, 0 = disabled.
# ------------------------------------------------------------------------------
PORTKNOCK_CHECK_CONFLICTS=1

# Bounds for the dynamic nftables sets (memory/DoS protection).
# PORTKNOCK_MAX_CLIENTS: tracked sources/interfaces in the allowed sets.
# PORTKNOCK_STAGE_SIZE : tracked sources per sequence-stage set.
# ------------------------------------------------------------------------------
PORTKNOCK_MAX_CLIENTS=1024
PORTKNOCK_STAGE_SIZE=65535

# NOTE: .netset and BLOCK_HOSTS/BLOCK_HOSTS_FILE bans are evaluated in
# HOST_BLOCK_SRC BEFORE portknock. A banned source cannot knock, and even
# PORTKNOCK_ALLOW_ALL=1 cannot bypass a ban. Only .netset whitelist entries
# (whitelist.netset / DEFAULT_NETSET_WHITELIST) bypass those bans.
#
# NOTE: Portknock controls new connection admission. Existing established
# connections are not forcibly closed when the open window expires.
