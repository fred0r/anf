# ------------------------------------------------------------------------------
#         -= Arno's (NFT) Firewall(ANF) - Flow Offload (fastpath) plugin =-
# ------------------------------------------------------------------------------
#
# This plugin targets PC Engines APU2 hardware. On that board (AMD GX-412TC,
# Intel i211 "igb" NICs) a single high-speed download pins ksoftirqd to one
# CPU core; the nftables flowtable fastpath is the main lever to relieve it,
# and the ring-buffer/governor defaults below are chosen for the APU2.
#
# To actually enable this plugin make ENABLED=1:
# ------------------------------------------------------------------------------
ENABLED=0

# Flowtable devices, as used by the nftables "devices = { ... }" statement.
# Leave empty to auto-derive from EXT_IF + INT_IF + DMZ_IF (wildcards expanded).
# Override example: "ppp0 enp1s0"
# ------------------------------------------------------------------------------
FASTPATH_DEVICES=""

# Interfaces for which the NIC ring buffers are raised (via ethtool -G).
# Leave empty to apply to all hardware NICs (those exposing /sys/class/net/<nic>/device).
# Override example: "enp1s0 enp3s0"
# ------------------------------------------------------------------------------
FASTPATH_NIC_RINGS=""

# Ring buffer sizes in descriptors, applied with "ethtool -G <if> rx/tx".
# Find the maximum your NIC supports with "ethtool -g <if>": use the RX/TX
# values listed under "Pre-set maximums" (larger values are rejected). The
# 4096 default is already the ceiling of the APU2's Intel i211 ("igb") NICs.
# ------------------------------------------------------------------------------
FASTPATH_RING_RX=4096
FASTPATH_RING_TX=4096

# CPU scaling governor applied to all CPUs. Leave empty to skip.
# ------------------------------------------------------------------------------
FASTPATH_GOVERNOR="performance"

# Flow offload inactivity timeouts (seconds). The kernel default is 30 for
# both; leave empty to leave them at default. Override example: "300" / "60".
# ------------------------------------------------------------------------------
FASTPATH_TCP_TIMEOUT=""
FASTPATH_UDP_TIMEOUT=""
