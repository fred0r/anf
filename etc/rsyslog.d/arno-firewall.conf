
# Log firewall messages to /var/log/arno-firewall (asynchronously),
# and then drop them so that they aren't logged again elsewhere.

# Start a one-shot close timer for a successful portknock.
if $syslogfacility-text == 'kern' \
and $msg contains 'ANF:Portknock opened:' then -/var/log/arno-firewall
& ^/usr/local/share/arno-firewall/plugins/portknock-close;RSYSLOG_TraditionalFileFormat
& stop

if $syslogfacility-text == 'kern' \
and $msg contains 'ANF:' then -/var/log/arno-firewall
& stop

if $syslogtag == 'firewall:' then -/var/log/arno-firewall

